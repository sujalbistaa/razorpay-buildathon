name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check src tests scripts

      - name: Typecheck (mypy --strict on domain/policy/compliance)
        run: |
          mypy src/vasool
          mypy scripts

      # No VASOOL_LLM secret is set here on purpose — the suite, including
      # test_compliance_invariants.py, must pass in stub mode with zero API keys.
      # That's the whole point of invariant 3's fallback design; CI is what proves it.
      - name: Test (pytest, including compliance invariants + determinism)
        run: |
          pytest
