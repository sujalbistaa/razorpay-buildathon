<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Revora{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#f6f3ec',
                        card: '#fdfcf9',
                        ink: '#1c1b17',
                        'ink-muted': '#66625a',
                        'ink-faint': '#9a9689',
                        line: '#e4e0d4',
                        accent: { DEFAULT: '#146b45', strong: '#0e5236', soft: '#e2ece6', glow: '#2f9d6c' },
                        baseline: '#c7c0ac',
                        warn: '#a6741f',
                        bad: '#a13f2c',
                    },
                    fontFamily: {
                        display: ['Fraunces', 'ui-serif', 'Georgia', 'serif'],
                        mono: ['"IBM Plex Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                        sans: ['"IBM Plex Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <style>
        body { font-feature-settings: "tnum" 1; }
        .label { font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; }
        .spinner {
            display: inline-block; width: 13px; height: 13px; border-radius: 999px;
            border: 2px solid currentColor; border-top-color: transparent;
            animation: spin 0.7s linear infinite; vertical-align: -2px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-paper text-ink font-sans min-h-screen flex flex-col antialiased">
    <nav class="sticky top-0 z-50 border-b border-line/70 bg-paper/75 backdrop-blur-md backdrop-saturate-150">
        <div class="max-w-6xl mx-auto px-6 py-6 flex items-center gap-8">
            <a href="/" class="flex items-center gap-2.5 shrink-0">
                <svg width="26" height="26" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="1" width="20" height="20" rx="3" stroke="#1c1b17" stroke-width="1.4"/>
                    <path d="M6.5 6.5H12C13.3807 6.5 14.5 7.61929 14.5 9C14.5 10.3807 13.3807 11.5 12 11.5H6.5V6.5Z" stroke="#146b45" stroke-width="1.4"/>
                    <path d="M6.5 11.5H11.5L15 15.5" stroke="#146b45" stroke-width="1.4" stroke-linecap="square"/>
                </svg>
                <span class="font-mono font-semibold tracking-tight text-[17px]">REVORA<span class="text-accent">.</span></span>
            </a>
            <div class="flex items-center gap-6 label text-[11px] text-ink-muted">
                <a href="/inspector" class="hover:text-ink transition-colors">Inspector</a>
                <a href="/admin/dlq" class="hover:text-ink transition-colors">DLQ</a>
                {% block nav_extra %}{% endblock %}
            </div>
            <a href="https://razorpay.com/buildathon" target="_blank" rel="noopener"
               class="ml-auto flex items-center gap-2.5 shrink-0">
                <span class="label text-[11px] text-ink-muted">Built for</span>
                <img src="/static/razorpay-logo.png" alt="Razorpay" class="h-[22px] w-auto">
                <span class="label text-[11px] text-ink-muted">Buildathon</span>
            </a>
        </div>
    </nav>
    <main class="max-w-6xl mx-auto px-6 py-10 flex-1 w-full">
        {% block content %}{% endblock %}
    </main>
    {% include "footer.html" %}
</body>
</html>
