<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Vasool{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <nav class="border-b border-slate-800 bg-slate-900">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-6">
            <a href="/" class="font-semibold tracking-tight text-lg">Vasool</a>
            <a href="/" class="text-sm text-slate-400 hover:text-slate-100">Dashboard</a>
            <a href="/inspector" class="text-sm text-slate-400 hover:text-slate-100">Inspector</a>
            <a href="/admin/dlq" class="text-sm text-slate-400 hover:text-slate-100">DLQ</a>
            {% block nav_extra %}{% endblock %}
        </div>
    </nav>
    <main class="max-w-6xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
